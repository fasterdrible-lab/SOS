# Rota publica do IA SDR: limite por IP contra rajadas e criacao em massa de conversas.
limit_req_zone $binary_remote_addr zone=salesos_sdr:10m rate=12r/m;

server {
    listen 80;
    server_name saleos.tech;

    client_max_body_size 5m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Respostas da IA podem levar bem mais que o padrao de 60s.
    proxy_read_timeout 120s;

    location /api/sdr/ {
        limit_req zone=salesos_sdr burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}

server {
    listen 80;
    server_name www.saleos.tech;
    return 301 https://saleos.tech$request_uri;
}
