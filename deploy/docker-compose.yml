name: salesos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesos
      POSTGRES_USER: salesos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesos -d salesos"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: salesos-web:${WEB_TAG:?defina no .env}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Somente localhost: o acesso externo passa pelo nginx, e o Docker ignoraria o ufw.
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  db_data:
