name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salesos
          POSTGRES_PASSWORD: salesos
          POSTGRES_DB: salesos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Valores descartaveis, validos apenas neste banco temporario do CI.
    env:
      DATABASE_URL: postgresql://salesos:salesos@localhost:5432/salesos
      AUTH_SECRET: ci-somente-para-testes-0123456789abcdef
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      INTEGRATION_ENCRYPTION_KEY: ci-somente-para-testes-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run build

      - name: Testes de integracao
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/login && break
            sleep 1
          done
          npm run test:integration

      - name: Log do app em caso de falha
        if: failure()
        run: tail -n 100 next.log || true
